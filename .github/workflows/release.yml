# Publishes a GitHub release: when a version tag (v*) is pushed, or by hand (Actions → Release → Run
# workflow, version "v0.1.0"), which creates the tag on the commit it runs on. Tests and type check
# must pass on that commit; the notes are the version's section of CHANGELOG.md.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create, e.g. v0.1.0 (must have a CHANGELOG.md section)'
        required: true
env:
  TAG: ${{ inputs.version || github.ref_name }}
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm test
      - run: npm install --no-audit --no-fund && npm run typecheck
      - name: Release notes from CHANGELOG.md
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} /^\[[0-9]/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::no CHANGELOG.md section for $v"; exit 1; }
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::version must look like v1.2.3"; exit 1;; esac
          if [ "$GITHUB_EVENT_NAME" = push ]; then verify=--verify-tag; else verify="--target $GITHUB_SHA"; fi
          gh release create "$TAG" --title "TeacherDox Core $TAG" --notes-file notes.md $verify
