# Evaluation: the synthetic cases in eval/cases.json through the Meta Model API, Muse Spark Open on
# Baseten and Gemini; per-field accuracy, latency, tokens and cost. Boards are rendered and voice notes
# spoken here (never real classroom data). Results: job summary, log, and the "eval-results" artifact
# (results.json, RESULTS.md). Secrets: META_API_KEY, BASETEN_API_KEY, GEMINI_API_KEY (+ GEMINI_BACKEND=vertex
# and GEMINI_MODEL repository variables) — a configuration whose key is missing is reported as "not run".
name: Eval
on:
  workflow_dispatch:
    inputs:
      gemini_model:
        description: 'Gemini model to evaluate (overrides the GEMINI_MODEL variable; needed on Vertex, whose model list refuses API keys)'
        required: false
        default: ''
  push:
    branches: ['claude/**']
    paths:
      - 'eval/*.js'
      - 'eval/*.py'
      - 'eval/cases.json'
      - 'hosts/*.js'
      - '.github/workflows/eval.yml'
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tools (ffmpeg, espeak-ng, Pillow)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core python3-pil >/dev/null
      - name: Render synthetic boards
        run: python3 eval/render_boards.py eval/cases.json eval/data/boards
      - name: Speak synthetic voice notes (OGG/Opus, like WhatsApp)
        run: |
          mkdir -p eval/data/voices
          node -e "
            const c = require('./eval/cases.json');
            for (const v of c.voices) console.log([v.id, v.voice, v.say].join('\t'));
          " | while IFS=$'\t' read -r id voice say; do
            espeak-ng -v "$voice" -w /tmp/raw.wav "$say"
            ffmpeg -loglevel error -y -i /tmp/raw.wav -c:a libopus -b:a 24k "eval/data/voices/$id.ogg"
          done
          ls -la eval/data/voices
      - name: Meta models visible to this key
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: node scripts/meta_models.js
      - name: Run
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini_model || vars.GEMINI_MODEL }}
          GEMINI_BACKEND: ${{ vars.GEMINI_BACKEND }}
          EVAL_DATA: eval/data
          OUT_DIR: eval/out
        run: node eval/run.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/out/
          if-no-files-found: ignore
